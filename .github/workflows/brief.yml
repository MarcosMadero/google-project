name: Actualizar parte del día

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Armar brief.json
        run: node scripts/build-brief.mjs

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brief.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualiza parte del día"
          git push
