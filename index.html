<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Parte del día</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* blanco + azul eléctrico, en tonos */
    --paper:#FFFFFF;
    --paper-2:#F1F4FF;
    --electric:#1B34FF;
    --electric-soft:#4E63FF;
    --deep:#0A1550;
    --mid:#5F6DA6;
    --line:#DCE3FB;

    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --read:"Newsreader",Georgia,serif;
    --util:"Azeret Mono",ui-monospace,monospace;

    --pad:20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--deep);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:560px;margin:0 auto;padding:0 var(--pad);}

  /* ---------- barra del amanecer : el elemento firma ---------- */
  .dawn{
    position:sticky;top:0;z-index:10;
    background:var(--paper);
    padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 12px;
    border-bottom:1px solid var(--line);
  }
  .dawn-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--util);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mid);
  }
  .dawn-meta strong{color:var(--electric);font-weight:500;}
  .dawn-track{
    position:relative;height:3px;margin-top:10px;border-radius:2px;
    background:linear-gradient(90deg,var(--line) 0%,#AEBDFB 22%,var(--electric) 50%,#AEBDFB 78%,var(--line) 100%);
  }
  .dawn-dot{
    position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
    border-radius:50%;background:var(--electric);
    box-shadow:0 0 0 3px var(--paper),0 0 12px 2px rgba(27,52,255,.45);
    transition:left 1.2s cubic-bezier(.2,.7,.2,1);
  }
  .dawn-ends{
    display:flex;justify-content:space-between;margin-top:7px;
    font-family:var(--util);font-size:10px;letter-spacing:.05em;color:var(--mid);
  }

  /* ---------- saludo ---------- */
  .hello{padding:30px 0 26px;border-bottom:1px solid var(--line);}
  .hello h1{
    font-family:var(--display);
    font-size:clamp(34px,10vw,46px);
    font-weight:800;line-height:.98;letter-spacing:-.03em;
    margin:0 0 12px;
  }
  .hello h1 span{color:var(--electric);}
  .hello p{
    font-family:var(--read);font-size:18px;line-height:1.45;
    color:var(--mid);margin:0;max-width:36ch;
  }
  .hello em{color:var(--deep);font-style:italic;}

  /* ---------- secciones ---------- */
  .sec{padding:26px 0;border-bottom:1px solid var(--line);}
  .sec-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:16px;
  }
  .sec-head h2{
    font-family:var(--util);font-size:11px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--electric);margin:0;
  }
  .sec-count{font-family:var(--util);font-size:11px;color:var(--mid);}

  /* agenda */
  .ev{display:flex;gap:14px;padding:9px 0;align-items:baseline;}
  .ev-time{
    font-family:var(--util);font-size:13px;color:var(--mid);
    min-width:44px;flex-shrink:0;
  }
  .ev-title{font-size:16px;line-height:1.3;}
  .ev-where{font-family:var(--util);font-size:11px;color:var(--mid);margin-top:3px;}
  .ev.soon .ev-time{color:var(--electric);font-weight:500;}

  /* correo */
  .mail{padding:11px 0;border-top:1px solid var(--line);}
  .mail:first-of-type{border-top:0;}
  .mail-from{
    font-family:var(--util);font-size:11px;letter-spacing:.04em;
    color:var(--electric-soft);text-transform:uppercase;
  }
  .mail-subj{font-size:16px;line-height:1.3;margin:4px 0 3px;}
  .mail-snip{font-family:var(--read);font-size:14px;line-height:1.45;color:var(--mid);margin:0;}

  /* noticias */
  .item{padding:13px 0;border-top:1px solid var(--line);display:block;}
  .item:first-of-type{border-top:0;padding-top:2px;}
  .item h3{
    font-family:var(--read);font-weight:400;
    font-size:19px;line-height:1.3;letter-spacing:-.01em;
    margin:0 0 6px;
  }
  .item-meta{
    font-family:var(--util);font-size:10.5px;letter-spacing:.05em;
    color:var(--mid);text-transform:uppercase;
  }
  .item-meta .dot{margin:0 6px;color:var(--electric);}
  .item.lead{
    background:var(--paper-2);
    margin:0 calc(var(--pad) * -1);
    padding:16px var(--pad);
    border-top:0;
  }
  .item.lead h3{font-size:25px;line-height:1.2;}

  /* deporte */
  .score{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:11px 0;border-top:1px solid var(--line);
  }
  .score:first-of-type{border-top:0;}
  .score-t{font-size:15px;}
  .score-t span{font-family:var(--util);font-size:11px;color:var(--mid);display:block;margin-top:3px;}
  .score-v{font-family:var(--util);font-size:16px;color:var(--electric);white-space:nowrap;}

  /* ---------- refrescar ---------- */
  .refresh-zone{
    padding:28px 0 calc(env(safe-area-inset-bottom) + 40px);
    text-align:center;
  }
  .refresh{
    font-family:var(--util);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--electric);background:var(--paper);
    border:1.5px solid var(--electric);border-radius:999px;
    padding:14px 30px;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;
    transition:background .18s ease,color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .refresh:active{background:var(--electric);color:var(--paper);}
  .refresh[data-busy="1"]{background:var(--electric);color:var(--paper);}
  .refresh .ring{
    width:11px;height:11px;border-radius:50%;
    border:1.5px solid currentColor;border-top-color:transparent;
  }
  .refresh[data-busy="1"] .ring{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .connect{
    font-family:var(--util);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--paper);background:var(--electric);
    border:1.5px solid var(--electric);border-radius:999px;
    padding:13px 26px;cursor:pointer;margin-bottom:14px;
    -webkit-tap-highlight-color:transparent;
  }
  .connect[hidden]{display:none;}
  .stamp{
    display:block;margin-top:14px;
    font-family:var(--util);font-size:10.5px;letter-spacing:.06em;
    color:var(--mid);text-transform:uppercase;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
  button:focus-visible,a:focus-visible{
    outline:2px solid var(--electric);outline-offset:3px;border-radius:2px;
  }
</style>
</head>
<body>

<header class="dawn">
  <div class="dawn-meta">
    <span id="today">—</span>
    <span><strong id="temp">—</strong> <span id="sky"></span></span>
  </div>
  <div class="dawn-track"><div class="dawn-dot" id="dot"></div></div>
  <div class="dawn-ends">
    <span id="sunrise">amanece —</span>
    <span id="sunset">anochece —</span>
  </div>
</header>

<main class="wrap">

  <section class="hello">
    <h1>Buen día,<br><span>Marc</span></h1>
    <p id="lead">Cargando el parte…</p>
  </section>

  <section class="sec" id="s-agenda"></section>
  <section class="sec" id="s-mail"></section>
  <section class="sec" id="s-news"></section>
  <section class="sec" id="s-sport"></section>

  <div class="refresh-zone">
    <button class="connect" id="gbtn" type="button" hidden>Conectar Google</button>
    <br>
    <button class="refresh" id="btn" type="button">
      <span class="ring"></span><span id="btn-label">Buscar novedades</span>
    </button>
    <span class="stamp" id="stamp">—</span>
  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="google.js"></script>
<script>
// ---------------------------------------------------------------
// Datos de ejemplo. La GitHub Action reemplaza esto por data/brief.json
// ---------------------------------------------------------------
const FALLBACK = {
  generatedAt: new Date().toISOString(),
  agenda: [
    {time:"09:30", title:"Revisión de wireframes", where:"Meet"},
    {time:"13:00", title:"Almuerzo con Nico", where:"Palermo"},
    {time:"18:00", title:"Turno consulado — documentación", where:"Av. Santa Fe"}
  ],
  mail: [
    {from:"Campus France", subject:"Tu expediente pasó a revisión",
     snippet:"Confirmamos la recepción de los documentos. Te contactaremos en los próximos días."},
    {from:"Centro Cien", subject:"Consulta sobre el reporte de agosto",
     snippet:"Marc, ¿podés pasarme el cruce actualizado antes del viernes?"}
  ],
  news: [
    {sec:"Mundo", items:[
      {title:"La UE cierra un acuerdo sobre el techo de importaciones tras doce horas de negociación", source:"Reuters", ago:"hace 2 h"},
      {title:"Nuevo paquete de ayuda aprobado en votación ajustada", source:"AP", ago:"hace 4 h"}
    ]},
    {sec:"Tecnología", items:[
      {title:"Apple adelanta el cambio de arquitectura para su próxima generación de chips", source:"Ars Technica", ago:"hace 3 h"},
      {title:"Una demanda antimonopolio avanza contra la tienda de aplicaciones", source:"The Verge", ago:"hace 5 h"}
    ]},
    {sec:"Argentina", items:[
      {title:"El Congreso define hoy el tratamiento del presupuesto", source:"Infobae", ago:"hace 1 h"},
      {title:"Se reactiva la obra del soterramiento tras dos años", source:"La Nación", ago:"hace 6 h"}
    ]},
    {sec:"Economía", items:[
      {title:"El dólar mayorista cierra la semana con la menor volatilidad desde marzo", source:"Ámbito", ago:"hace 2 h"},
      {title:"La Fed mantiene tasas y señala un recorte para el último trimestre", source:"Bloomberg", ago:"hace 8 h"}
    ]}
  ],
  sport: [
    {team:"Boca Juniors", detail:"Liga · fecha 4", value:"2–1"},
    {team:"Selección Argentina", detail:"Eliminatorias · jueves 21:00", value:"faltan 2 d"},
    {team:"Fórmula 1", detail:"GP de Hungría · clasificación", value:"sáb 11:00"},
    {team:"Deportes de invierno", detail:"Copa del Mundo FIS · slalom", value:"dom 06:30"}
  ]
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const hhmm = d => pad(d.getHours())+":"+pad(d.getMinutes());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const head = (t,c)=>`<div class="sec-head"><h2>${t}</h2><span class="sec-count">${c}</span></div>`;

function paintDate(){
  $("today").textContent = new Date()
    .toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
}

async function paintSky(){
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=-34.6037&longitude=-58.3816"
    + "&current=temperature_2m,weather_code"
    + "&daily=sunrise,sunset&timezone=America%2FArgentina%2FBuenos_Aires"
    + "&_=" + Date.now();
  try{
    const d = await (await fetch(url,{cache:"no-store"})).json();
    $("temp").textContent = Math.round(d.current.temperature_2m) + "°";
    $("sky").textContent = describe(d.current.weather_code);
    const rise = new Date(d.daily.sunrise[0]), set = new Date(d.daily.sunset[0]);
    $("sunrise").textContent = "amanece " + hhmm(rise);
    $("sunset").textContent  = "anochece " + hhmm(set);
    const p = Math.min(1, Math.max(0, (Date.now() - rise) / (set - rise)));
    requestAnimationFrame(()=> $("dot").style.left = (p*100).toFixed(2)+"%");
  }catch(e){
    $("temp").textContent = "—";
    $("sky").textContent = "sin clima";
  }
}
function describe(c){
  if(c===0) return "despejado";
  if(c<=2) return "algo nublado";
  if(c===3) return "nublado";
  if(c<=48) return "niebla";
  if(c<=57) return "llovizna";
  if(c<=67) return "lluvia";
  if(c<=77) return "nieve";
  if(c<=82) return "chaparrones";
  return "tormenta";
}

function paintLead(b){
  const ev=b.agenda.length, ml=b.mail.length, bits=[];
  if(ev) bits.push(`<em>${ev} ${ev===1?"evento":"eventos"}</em> en la agenda`);
  if(ml) bits.push(`<em>${ml} ${ml===1?"correo":"correos"}</em> que valen la pena`);
  let tail = bits.length ? bits.join(" y ") + "." : "El día está despejado.";
  if(b.agenda[0]) tail += ` Lo primero es a las ${b.agenda[0].time}.`;
  $("lead").innerHTML = tail;
}

function paintAgenda(b){
  const now = hhmm(new Date());
  $("s-agenda").innerHTML = head("Agenda", b.agenda.length ? b.agenda.length+" hoy" : "libre") +
    (b.agenda.length
      ? b.agenda.map(e=>`
        <div class="ev ${e.time>=now?"soon":""}">
          <div class="ev-time">${e.time}</div>
          <div><div class="ev-title">${esc(e.title)}</div>
          ${e.where?`<div class="ev-where">${esc(e.where)}</div>`:""}</div>
        </div>`).join("")
      : `<p class="mail-snip">Nada agendado. El día es tuyo.</p>`);
}

function paintMail(b){
  $("s-mail").innerHTML = head("Correo", b.mail.length ? b.mail.length+" relevantes" : "nada nuevo") +
    (b.mail.length
      ? b.mail.map(m=>`
        <div class="mail">
          <div class="mail-from">${esc(m.from)}</div>
          <div class="mail-subj">${esc(m.subject)}</div>
          <p class="mail-snip">${esc(m.snippet)}</p>
        </div>`).join("")
      : `<p class="mail-snip">Nada que abrir. Todo lo que llegó era ruido.</p>`);
}

function paintNews(b){
  $("s-news").innerHTML = b.news.map(g=>`
    ${head(g.sec,"")}
    ${g.items.map((it,i)=>`
      <a class="item ${i===0?"lead":""}" href="${it.url||"#"}">
        <h3>${esc(it.title)}</h3>
        <div class="item-meta">${esc(it.source)}<span class="dot">·</span>${esc(it.ago)}</div>
      </a>`).join("")}
  `).join('<div style="height:22px"></div>');
}

function paintSport(b){
  $("s-sport").innerHTML = head("Deporte","") + b.sport.map(s=>`
    <div class="score">
      <div class="score-t">${esc(s.team)}<span>${esc(s.detail)}</span></div>
      <div class="score-v">${esc(s.value)}</div>
    </div>`).join("");
}

// ---------- carga y refresco ----------
let lastSignature = "";

async function load(isManual){
  const btn = $("btn"), label = $("btn-label");
  if(isManual){ btn.dataset.busy = "1"; label.textContent = "Buscando…"; }

  let b = FALLBACK;
  try{
    const r = await fetch("data/brief.json?_=" + Date.now(), {cache:"no-store"});
    if(r.ok) b = Object.assign({}, FALLBACK, await r.json());
  }catch(e){/* queda el ejemplo */}

  if(window.GoogleFeed && GoogleFeed.isConnected()){
    try{
      const [ag, ml] = await Promise.all([GoogleFeed.fetchAgenda(), GoogleFeed.fetchMail()]);
      b = Object.assign({}, b, {agenda: ag, mail: ml});
    }catch(e){ console.warn("Google:", e.message); }
  }
  syncConnectButton();

  await paintSky();
  paintDate(); paintLead(b); paintAgenda(b); paintMail(b); paintNews(b); paintSport(b);

  const sig = JSON.stringify(b.news) + JSON.stringify(b.sport);
  const changed = lastSignature && sig !== lastSignature;
  lastSignature = sig;

  $("stamp").textContent = "Visto a las " + hhmm(new Date())
    + " · parte de las " + hhmm(new Date(b.generatedAt));

  if(isManual){
    btn.dataset.busy = "0";
    label.textContent = changed ? "Hay novedades" : "Sin novedades";
    setTimeout(()=> label.textContent = "Buscar novedades", 2200);
  }
}

function syncConnectButton(){
  const g = $("gbtn");
  if(!window.GoogleFeed) return;
  const on = GoogleFeed.isConnected();
  g.hidden = on;
  if(!on) g.textContent = "Conectar Google";
}

$("gbtn").addEventListener("click", async ()=>{
  try{
    await GoogleFeed.connect();
    await load(true);
  }catch(e){
    $("gbtn").textContent = "No se pudo conectar";
    setTimeout(()=> syncConnectButton(), 2200);
  }
});

$("btn").addEventListener("click", ()=> load(true));

window.addEventListener("load", ()=>{
  if(window.GoogleFeed) GoogleFeed.init();
  load(false);
});
</script>
</body>
</html>
